# Reusable CI for a tier-1 module repository (terraform-aws-<name>). The module is at the repo root
# and has tests/ and examples/*/. Call it pinned to a commit of this repository:
#
#   jobs:
#     module:
#       uses: askmohanty/aws-terraform-modules/.github/workflows/module-ci.yml@<commit-sha>
#       with:
#         hub-ref: <same commit-sha>
#     ci-ok:
#       name: CI result
#       if: always()
#       needs: [module]
#       runs-on: ubuntu-latest
#       steps:
#         - run: test "${{ needs.module.result }}" = success
name: Module CI

on:
  workflow_call:
    inputs:
      hub-ref:
        description: Commit of askmohanty/aws-terraform-modules whose policies and lint config to use (the same SHA as this workflow).
        type: string
        required: true

permissions:
  contents: read

env:
  OPA_VERSION: v1.22.3
  CONFTEST_VERSION: 0.71.1
  TERRAFORM_DOCS_VERSION: v0.24.0

jobs:
  test:
    name: test (${{ matrix.cli.name }} ${{ matrix.cli.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cli:
          - { name: terraform, version: 1.9.8 }   # minimum supported
          - { name: terraform, version: 1.17.1 }  # latest
          - { name: tofu, version: 1.13.9 }       # OpenTofu latest
    env:
      TF: ${{ matrix.cli.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Terraform
        if: matrix.cli.name == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.cli.version }}
          terraform_wrapper: false
      - name: Set up OpenTofu
        if: matrix.cli.name == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ matrix.cli.version }}
          tofu_wrapper: false
      - name: Format
        run: $TF fmt -check -recursive
      - name: Validate module
        run: $TF init -backend=false -input=false && $TF validate
      - name: Test (mocked providers, no cloud credentials)
        run: $TF test
      - name: Validate every example
        run: |
          set -euo pipefail
          for ex in examples/*/; do
            echo "== $ex"
            (cd "$ex" && $TF init -backend=false -input=false >/dev/null && $TF validate)
          done

  lint:
    name: tflint and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the hub's shared config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: askmohanty/aws-terraform-modules
          ref: ${{ inputs.hub-ref }}
          path: .hub
          persist-credentials: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.66.0
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tflint --init --config "$GITHUB_WORKSPACE/.hub/.tflint.hcl"
          tflint --config "$GITHUB_WORKSPACE/.hub/.tflint.hcl"
      - name: Install terraform-docs (checksum verified)
        run: |
          set -euo pipefail
          a="terraform-docs-$TERRAFORM_DOCS_VERSION-linux-amd64.tar.gz"
          base="https://github.com/terraform-docs/terraform-docs/releases/download/$TERRAFORM_DOCS_VERSION"
          curl -sfLO "$base/$a"
          curl -sfLo sums "$base/terraform-docs-$TERRAFORM_DOCS_VERSION.sha256sum"
          grep " $a\$" sums | sha256sum -c -
          tar -xzf "$a" terraform-docs && sudo install terraform-docs /usr/local/bin/
      - name: README inputs and outputs are up to date
        run: terraform-docs -c .hub/.terraform-docs.yml --output-check .

  policy:
    name: examples pass the policies
    runs-on: ubuntu-latest
    services:
      localstack:
        # AWS emulator so plans run without an AWS account; the last licence-free release (`4`).
        image: localstack/localstack@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
        ports:
          - 4566:4566
    env:
      AWS_ENDPOINT_URL: http://localhost.localstack.cloud:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the hub's policies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: askmohanty/aws-terraform-modules
          ref: ${{ inputs.hub-ref }}
          path: .hub
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - name: Install Conftest (checksum verified)
        run: |
          set -euo pipefail
          a="conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          base="https://github.com/open-policy-agent/conftest/releases/download/v$CONFTEST_VERSION"
          curl -sfLO "$base/$a"
          curl -sfLo sums "$base/checksums.txt"
          grep " $a\$" sums | sha256sum -c -
          tar -xzf "$a" conftest && sudo install conftest /usr/local/bin/
      - name: Wait for LocalStack
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:4566/_localstack/health >/dev/null && exit 0; sleep 2; done
          echo "::error::LocalStack did not start"; exit 1
      - name: Plan every example and run the policies
        run: |
          set -euo pipefail
          for dir in examples/*/; do
            echo "::group::$dir"
            (cd "$dir" && terraform init -backend=false -input=false >/dev/null \
              && terraform plan -input=false -out tfplan >/dev/null \
              && terraform show -json tfplan > plan.json)
            conftest test "$dir/plan.json" -p .hub/policies --data .hub/policies/data --all-namespaces
            echo "::endgroup::"
          done
